<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Индивидуальное задание 2</title><link rel="stylesheet" href="styles.css"><script src="../_libs/jquery-3.7.1.min.js"></script><script>$(function(){ $('#color-input').keypress(function(){ var c='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'); $(this).css('background-color',c); $('#value').text(c); }); });</script></head><body><header><h1>Индивидуальное задание 2 — вариант 4</h1><p>При каждом <code>keypress</code> поле получает случайный цвет.</p></header><main><nav><a href="index.html">К примерам</a></nav><section class="card"><label>Введите текст: <input id="color-input" type="text" autofocus></label><p>Текущий цвет: <strong id="value">ещё не установлен</strong></p></section></main></body></html>
