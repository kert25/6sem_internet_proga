<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Индивидуальное задание 3</title><link rel="stylesheet" href="styles.css"><script src="../_libs/jquery-3.7.1.min.js"></script><script>$(function(){ $('#random').click(function(){ $('.choice').hide(); var n=Math.floor(Math.random()*5)+1; $('#div'+n).fadeIn(3000); $('#result').text('Выбрана область div'+n); }); $('#reset').click(function(){ $('.choice').hide(); $('#result').text('Все области скрыты'); }); });</script></head><body><header><h1>Индивидуальное задание 3 — вариант 2</h1><p>Случайное проявление одной из пяти скрытых областей.</p></header><main><nav><a href="index.html">К примерам</a></nav><section class="card"><button id="random">Показать случайную область</button> <button id="reset">Скрыть все</button><p id="result" class="notice">Ожидание действия.</p><div class="tiles"><div id="div1" class="choice tile red" style="display:none">Область 1</div><div id="div2" class="choice tile green" style="display:none">Область 2</div><div id="div3" class="choice tile blue" style="display:none">Область 3</div><div id="div4" class="choice tile" style="display:none;background:#8e44ad">Область 4</div><div id="div5" class="choice tile" style="display:none;background:#d35400">Область 5</div></div></section></main></body></html>
