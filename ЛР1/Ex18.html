<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 17. Абсолютное позиционирование</title>
</head>
<body>
    <h1>Абсолютное позиционирование изображения</h1>
    <p>Изображение помещено в тег &lt;div&gt; с абсолютным позиционированием
       и смещено вниз и влево на 500 пикселей от исходного положения
       (родительский блок расположен в правой части страницы).</p>
    <!-- Родительский блок: исходное положение изображения (справа вверху) -->
    <div style="position:relative; width:300px; margin-left:950px;">
        <!-- Изображение в теге <div>: смещение вниз и влево на 500 px -->
        <div style="position:absolute; top:500px; left:-500px;">
            <img src="img/picture.png" width="300" alt="Картинка">
        </div>
    </div>
</body>
</html>
