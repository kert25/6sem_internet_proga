<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 4. Скрипт-пароль</title>
</head>
<body>
    <h1>Ввод пароля</h1>
    <script language="JavaScript" type="text/JavaScript">
        // Переменная password хранит верное значение пароля
        var password = "секрет";

        // Пользователя просят ввести правильный пароль
        var pass = prompt("Введите пароль", "");

        if (pass == password) {
            // при вводе правильного пароля — сообщение в окне браузера
            document.write("Пароль верен. Добро пожаловать!");
        }
        else {
            // при вводе неправильного пароля — сообщение об ошибке
            alert("Пароль введен неверно!");
        }
    </script>
</body>
</html>
