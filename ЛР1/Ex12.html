<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 12. Ссылки и события</title>
</head>
<body>
    <h1>Две ссылки</h1>
    <!-- Первая ссылка: на PDF-файл; при нажатии — предупреждение с confirm(...) -->
    <p>
        <a href="docs/task12.pdf"
           onClick="return confirm('Для загрузки PDF-документа требуется программа типа Acrobat. Продолжить загрузку?')">
            Документ в формате PDF
        </a>
    </p>
    <!-- Вторая ссылка: при наведении мыши меняется цвет фона документа на красный -->
    <p>
        <a href="#"
           onMouseOver="document.bgColor='red'">
            Ссылка, меняющая цвет фона при наведении
        </a>
    </p>
</body>
</html>
