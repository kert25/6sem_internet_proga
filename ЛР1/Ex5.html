<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 5. Прорисовка линий</title>
</head>
<body>
    <h1>Пример простой</h1>
    <script language="JavaScript" type="text/JavaScript">
        // Функция прорисовки горизонтальной линии заданной ширины
        function line(w) {
            document.writeln("<hr align='center' width='" + w + "'>");
        }
        // Десять линий друг под другом:
        // первая — 10 пикселей, каждая следующая — на 10 пикселей больше
        for (var i = 1; i <= 10; i++) {
            line(i * 10);
        }
    </script>
</body>
</html>
