<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 1. Диалоговое окно и вывод в окно браузера</title>
</head>
<body>
    <!-- Первый абзац произвольного текста -->
    <p>Первый абзац текста. Демонстрация размещения скриптов в HTML-документе.</p>

    <!-- Приветствие в диалоговом окне: команды внутри тэга <script> -->
    <script language="JavaScript">
        alert("Здравствуйте! Добро пожаловать на нашу страницу!");   // диалоговое окно
    </script>

    <!-- Второй абзац произвольного текста -->
    <p>Второй абзац текста. Между абзацами было показано диалоговое окно.</p>

    <!-- После закрытия диалогового окна — аналогичное приветствие в окне браузера -->
    <script language="JavaScript">
        document.write("Здравствуйте! Добро пожаловать на нашу страницу!");   // вывод в окно браузера
    </script>
</body>
</html>
