<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 6. Таблица степеней двойки</title>
</head>
<body>
    <h1>Степени двойки</h1>
    <script language="JavaScript" type="text/JavaScript">
        // Начало таблицы: строка заголовка
        document.write("<table border='1' cellpadding='4'>");
        document.write("<tr><th>Степень</th><th>Результат</th></tr>");

        // На каждой итерации цикла формируется очередная строка таблицы
        for (var i = 0; i <= 5; i++) {
            // в первую ячейку — степень, во вторую — результат Math.pow(2, i)
            document.write("<tr><td>2<sup>" + i + "</sup></td><td>" + Math.pow(2, i) + "</td></tr>");
        }
        // Конец таблицы
        document.write("</table>");
    </script>
</body>
</html>
